      linear-gradient(90deg, rgba(0,0,0,.22), transparent 32%, transparent 68%, rgba(0,0,0,.22));
    z-index: -1;
  }
  .grain {
    position: absolute;
    inset: -50%;
    opacity: .07;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    transform: rotate(7deg);
    z-index: 2;
  }
  .content {
    position: relative;
    z-index: 3;
    width: min(92vw, 700px);
    text-align: center;
    transform: translateY(-1vh);
  }
  .eyebrow {
    margin-bottom: 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .42em;
    text-transform: uppercase;
    color: rgba(222,236,247,.78);
    text-shadow: 0 2px 18px rgba(0,0,0,.9);
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(64px, 11vw, 132px);
    line-height: .82;
    letter-spacing: -.075em;
    font-weight: 950;
    text-transform: uppercase;
    color: #f4f8fb;
    text-shadow:
      0 3px 0 rgba(0,0,0,.32),
      0 12px 48px rgba(0,0,0,.75);
  }
  .rule {
    width: 78px;
    height: 2px;
    margin: 27px auto 24px;
    background: linear-gradient(90deg, transparent, rgba(214,231,243,.9), transparent);
  }
  .tagline {
    margin: 0 auto 34px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .27em;
    text-transform: uppercase;
    color: rgba(239,246,251,.82);
    text-shadow: 0 2px 14px rgba(0,0,0,.9);
  }
  .actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 13px;
  }
  .btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(330px, 78vw);
    min-height: 58px;
    padding: 0 28px;
    border: 1px solid rgba(235,245,252,.34);
    border-radius: 10px;
    background: rgba(58, 58, 66, .78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .24em;
    text-transform: uppercase;
    box-shadow: 0 16px 45px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.07);
    transition: transform .2s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .btn:hover {
    transform: translateY(-3px);
    background: rgba(20,30,41,.76);
    border-color: rgba(235,245,252,.72);
    box-shadow: 0 22px 60px rgba(0,0,0,.44), inset 0 1px 0 rgba(255,255,255,.11);
  }
  .btn:active { transform: translateY(-1px); }
  .btn.store {
    cursor: default;
    opacity: .9;
  }
  .coming {
    margin-top: -2px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .34em;
    color: rgba(226,236,244,.58);
    text-transform: uppercase;
  }
  .corner {
    position: absolute;
    z-index: 3;
    left: 28px;
    bottom: 24px;
    font-size: 9px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(240,247,252,.44);
  }
  @media (max-width: 600px) {
    .logo-wrap { width: min(280px, 66vw); margin-top: 14px; }
    .ip {
    position: absolute;
    z-index: 4;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 19px;
    border: 1px solid rgba(235,245,252,.34);
    border-radius: 10px;
    background: rgba(7,12,18,.58);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #eee5f7;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .14em;
    text-shadow:
      0 0 9px rgba(150,123,182,.95),
      0 0 24px rgba(150,123,182,.72);
    box-shadow:
      0 0 20px rgba(150,123,182,.2),
      inset 0 1px 0 rgba(255,255,255,.07);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }

  .ip:hover {
    transform: translateX(-50%) translateY(-2px);
    border-color: rgba(150,123,182,.9);
    background: rgba(0,0,0,.96);
    box-shadow:
      0 0 28px rgba(150,123,182,.34),
      inset 0 1px 0 rgba(255,255,255,.1);
  }

  .ip:active {
    transform: translateX(-50%) translateY(0);
  }

  .copy-hint {
    padding-left: 10px;
    border-left: 1px solid rgba(150,123,182,.35);
    color: rgba(220,207,234,.58);
    font-size: 8px;
    letter-spacing: .18em;
  }
  @media (prefers-reduced-motion: no-preference) {
    .content { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(3vh); }
      to { opacity: 1; transform: translateY(-1vh); }
    }
  }

  .logo-wrap {
    position: relative;
    width: min(320px, 62vw);
    margin: 17px auto 27px;
    display: grid;
    place-items: center;
    isolation: isolate;
  }

    position: relative;

    width: 100%;
    height: auto;
    max-height: 175px;

    filter:
      drop-shadow(0 0 24px rgba(150, 123, 182, 1))

<script>
const ipButton = document.getElementById("serverIp");
ipButton.addEventListener("click", async () => {
  const ip = "void.folium.vip";
  try {
    await navigator.clipboard.writeText(ip);
  } catch {
    const area = document.createElement("textarea");
    area.value = ip;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }

  const hint = ipButton.querySelector(".copy-hint");
  if (hint) {
    const original = hint.textContent;
    hint.textContent = "COPIED!";
    setTimeout(() => hint.textContent = original, 1400);
  }
});
</script>
